name: Daily data pipeline

on:
  schedule:
    - cron: '0 0 * * *'    # 00:00 UTC — overnight refresh
    - cron: '0 12 * * *'   # 12:00 UTC — midday refresh
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push the updated JSON files

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore SMARD parquet cache
        uses: actions/cache@v5.0.5
        with:
          path: data/raw/smard_raw.parquet
          # Key rotates weekly so historical data refreshes once a week
          key: smard-parquet-${{ github.run_id }}
          restore-keys: smard-parquet-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pipeline
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python pipeline/run.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spot_quantiles.json data/capture_prices.json data/yoy_overlay.json data/generation_mix.json data/generation_mix_hourly.json data/solar_wind_price_hourly.json data/solar_wind_price_daily.json data/price_duration.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"

      - name: Push
        run: git pull --rebase && git push
